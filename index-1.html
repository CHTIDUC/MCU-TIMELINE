<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MCU Timeline — Doomsday</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --red: #c0392b;
    --red-glow: #e74c3c;
    --bg: #07070e;
    --bg2: #0d0d1a;
    --bg3: #12121f;
    --card: #111120;
    --card-hover: #1a1a2e;
    --border: #1e1e35;
    --text: #d0d0e8;
    --text-dim: #666688;
    --white: #f0f0ff;
    --green: #27ae60;
    --green-glow: #2ecc71;
    --arc1: #c9a84c;
    --arc2: #e74c3c;
    --arc3: #3498db;
    --arc4: #9b59b6;
    --arc5: #1abc9c;
    --arc6: #e67e22;
    --arc7: #e91e63;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BACKGROUND */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(201,168,76,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 30% at 100% 100%, rgba(192,57,43,0.05) 0%, transparent 50%),
      radial-gradient(ellipse 40% 50% at 0% 50%, rgba(52,152,219,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* HEADER */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(7,7,14,0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
  }

  .header-inner {
    max-width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    gap: 16px;
  }

  .logo {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .logo-top {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .logo-main {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--white);
    letter-spacing: 2px;
    line-height: 1;
  }

  .logo-doom {
    color: var(--red-glow);
    text-shadow: 0 0 20px rgba(231,76,60,0.5);
  }

  .progress-ring {
    position: relative;
    width: 52px;
    height: 52px;
    flex-shrink: 0;
  }

  .progress-ring svg { transform: rotate(-90deg); }

  .progress-ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1.2;
  }

  .progress-ring-label {
    font-size: 6px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* WEEK BANNER */
  .week-banner {
    background: linear-gradient(135deg, rgba(201,168,76,0.12), rgba(192,57,43,0.08));
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 12px;
    margin: 16px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }

  .week-banner::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(to bottom, var(--gold), var(--red));
  }

  .week-banner-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 4px;
  }

  .week-banner-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--white);
    letter-spacing: 1px;
  }

  .week-banner-films {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .week-banner-dl {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    background: rgba(192,57,43,0.15);
    border: 1px solid rgba(192,57,43,0.3);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: #ff6b6b;
    font-weight: 600;
  }

  /* ARC SECTIONS */
  .arc-section {
    margin: 24px 0 0;
    position: relative;
  }

  .arc-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px 12px;
  }

  .arc-icon {
    font-size: 20px;
  }

  .arc-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--white);
  }

  .arc-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--arc-color, var(--gold)), transparent);
  }

  .arc-count {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    color: var(--text-dim);
  }

  /* HORIZONTAL SCROLL TIMELINE */
  .timeline-scroll {
    overflow-x: auto;
    overflow-y: visible;
    padding: 0 16px 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    -webkit-overflow-scrolling: touch;
  }

  .timeline-scroll::-webkit-scrollbar {
    height: 3px;
  }
  .timeline-scroll::-webkit-scrollbar-track { background: transparent; }
  .timeline-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .timeline-track {
    display: flex;
    gap: 12px;
    width: max-content;
    padding-bottom: 8px;
    position: relative;
  }

  /* Film connector line */
  .timeline-track::before {
    content: '';
    position: absolute;
    top: 80px;
    left: 0;
    right: 0;
    height: 2px;
    background: repeating-linear-gradient(
      to right,
      var(--arc-color, var(--border)) 0px,
      var(--arc-color, var(--border)) 20px,
      transparent 20px,
      transparent 30px
    );
    opacity: 0.3;
    pointer-events: none;
  }

  /* FILM CARD */
  .film-card {
    width: 130px;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .film-card:active { transform: scale(0.96); }

  .film-card.watched .film-poster-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(39,174,96,0.15);
    border-radius: 10px;
    pointer-events: none;
  }

  .film-card.deadline .film-poster-wrap::before {
    content: '⚠ DL';
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 10;
    background: rgba(192,57,43,0.9);
    color: white;
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    font-weight: 700;
    padding: 3px 6px;
    border-radius: 4px;
    letter-spacing: 1px;
  }

  .film-card.current-week .film-poster-wrap {
    box-shadow: 0 0 0 2px var(--gold), 0 0 20px rgba(201,168,76,0.3);
  }

  .film-poster-wrap {
    width: 130px;
    height: 195px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .film-card:hover .film-poster-wrap {
    border-color: rgba(201,168,76,0.4);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    transform: translateY(-4px);
  }

  .film-poster {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: filter 0.3s;
  }

  .film-card.watched .film-poster {
    filter: brightness(0.5) saturate(0.3);
  }

  .film-poster-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg3), var(--bg2));
    gap: 8px;
    padding: 12px;
  }

  .film-poster-placeholder .ph-icon { font-size: 32px; opacity: 0.4; }
  .film-poster-placeholder .ph-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    text-align: center;
    color: var(--text-dim);
    line-height: 1.2;
  }

  /* WATCHED OVERLAY */
  .watch-badge {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .film-card.watched .watch-badge {
    opacity: 1;
  }

  .watch-badge-inner {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(39,174,96,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(39,174,96,0.5);
  }

  /* FILM INFO */
  .film-info {
    padding: 8px 2px 0;
  }

  .film-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--white);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .film-card.watched .film-title {
    color: var(--green-glow);
  }

  .film-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }

  .film-duration {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'Orbitron', sans-serif;
  }

  .film-type-badge {
    font-size: 9px;
    background: rgba(255,255,255,0.07);
    border-radius: 4px;
    padding: 2px 5px;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .film-type-badge.serie { background: rgba(52,152,219,0.15); color: #74b9ff; }

  /* WEEK LABEL ON CARDS */
  .film-week-tag {
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 2px;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.5px;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 8px;
    padding: 0 16px 16px;
  }

  .stat-card {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 10px;
    text-align: center;
  }

  .stat-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    display: block;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* COUNTDOWN */
  .countdown-bar {
    margin: 0 16px 20px;
    background: var(--card);
    border: 1px solid rgba(192,57,43,0.3);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .countdown-icon { font-size: 28px; flex-shrink: 0; }

  .countdown-info { flex: 1; }

  .countdown-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    color: var(--red-glow);
    letter-spacing: 3px;
    margin-bottom: 4px;
  }

  .countdown-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--white);
    letter-spacing: 1px;
    line-height: 1;
  }

  .countdown-days {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--red-glow);
    text-shadow: 0 0 20px rgba(231,76,60,0.5);
    flex-shrink: 0;
    text-align: right;
  }

  .countdown-days span {
    display: block;
    font-size: 9px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-align: right;
    margin-top: -2px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--green);
    color: white;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 30px;
    z-index: 1000;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast.unwatched {
    background: var(--text-dim);
  }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(7,7,14,0.97);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
  }

  .nav-btn {
    flex: 1;
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-btn.active { color: var(--gold); }
  .nav-btn .nav-icon { font-size: 20px; }

  /* FILTER ROW */
  .filter-row {
    display: flex;
    gap: 8px;
    padding: 0 16px 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }

  .filter-chip {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-chip.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(8px);
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    width: 100%;
    background: var(--bg3);
    border-radius: 20px 20px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 20px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-overlay.open .modal {
    transform: translateY(0);
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-poster-row {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
  }

  .modal-poster {
    width: 90px;
    height: 135px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  .modal-poster-placeholder {
    width: 90px;
    height: 135px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    flex-shrink: 0;
  }

  .modal-meta { flex: 1; }

  .modal-arc {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: var(--white);
    letter-spacing: 1px;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  .modal-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .modal-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 600;
  }

  .modal-week {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .modal-dl {
    font-size: 12px;
    color: #ff6b6b;
    font-weight: 600;
  }

  .modal-watch-btn {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 8px;
  }

  .modal-watch-btn.mark {
    background: linear-gradient(135deg, var(--green), #1a7a40);
    color: white;
  }

  .modal-watch-btn.unmark {
    background: rgba(255,255,255,0.06);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  /* PAGE VIEWS */
  .page { display: none; padding-bottom: 70px; }
  .page.active { display: block; }

  /* PROGRESSION PAGE */
  .prog-section {
    padding: 16px;
  }

  .prog-arc {
    margin-bottom: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .prog-arc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }

  .prog-arc-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .prog-arc-pct {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
  }

  .prog-bar-wrap {
    height: 4px;
    background: var(--bg);
    position: relative;
  }

  .prog-bar-fill {
    height: 100%;
    background: linear-gradient(to right, var(--gold), var(--red));
    transition: width 0.6s ease;
  }

  .prog-films {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .prog-film-row {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 8px;
    transition: background 0.2s;
  }

  .prog-film-row:hover { background: rgba(255,255,255,0.04); }

  .prog-film-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
    transition: all 0.3s;
  }

  .prog-film-row.watched .prog-film-check {
    background: var(--green);
    border-color: var(--green);
  }

  .prog-film-name {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .prog-film-row.watched .prog-film-name {
    color: var(--text-dim);
    text-decoration: line-through;
  }

  .prog-film-dur {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'Orbitron', sans-serif;
  }

  /* Responsive tweaks */
  @media (max-width: 380px) {
    .film-card { width: 110px; }
    .film-poster-wrap { width: 110px; height: 165px; }
  }
</style>
</head>
<body>

<!-- PAGES -->
<div id="page-home" class="page active">

  <!-- HEADER -->
  <div class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-top">Marvel Timeline</div>
        <div class="logo-main">AVANT <span class="logo-doom">DOOMSDAY</span></div>
      </div>
      <div class="progress-ring">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="22" fill="none" stroke="#1e1e35" stroke-width="4"/>
          <circle id="ring-fill" cx="26" cy="26" r="22" fill="none" stroke="#c9a84c" stroke-width="4"
            stroke-dasharray="138.2" stroke-dashoffset="138.2" stroke-linecap="round"/>
        </svg>
        <div class="progress-ring-text">
          <div id="ring-pct">0%</div>
          <div class="progress-ring-label">VU</div>
        </div>
      </div>
    </div>
  </div>

// CURRENT WEEK detection
function getCurrentWeek() {

    { week: 'S7', start: new Date('2026-06-15'), end: new Date('2026-06-21') },

    { week: 'S16', start: new Date('2026-08-17'), end: new Date('2026-08-23') },
    { week: 'S17', start: new Date('2026-08-24'), end: new Date('2026-08-30') },
    { week: 'S18', start: new Date('2026-08-31'), end: new Date('2026-09-06') },
    { week: 'S19', start: new Date('2026-09-07'), end: new Date('2026-09-13') },
    { week: 'S20', start: new Date('2026-09-14'), end: new Date('2026-09-20') },
    { week: 'S21', start: new Date('2026-09-21'), end: new Date('2026-09-27') },
    { week: 'S22', start: new Date('2026-09-28'), end: new Date('2026-10-04') },
    { week: 'S23', start: new Date('2026-10-05'), end: new Date('2026-10-11') },
    { week: 'S24', start: new Date('2026-10-12'), end: new Date('2026-10-18') },
    { week: 'S25', start: new Date('2026-10-19'), end: new Date('2026-10-25') },
    { week: 'S26', start: new Date('2026-10-26'), end: new Date('2026-11-01') },
    { week: 'S27', start: new Date('2026-11-02'), end: new Date('2026-11-08') },
    { week: 'S28', start: new Date('2026-11-09'), end: new Date('2026-11-15') },
    { week: 'S29', start: new Date('2026-11-16'), end: new Date('2026-11-22') },
  ];
  for (const w of weeks) {
    if (now >= w.start && now <= w.end) return w.week;
  }
  if (now < weeks[0].start) return 'S1';
  return 'S29';
}

const CURRENT_WEEK = getCurrentWeek();

// =====================
// STATE
// =====================
let watched = JSON.parse(localStorage.getItem('mcu_watched') || '[]');
let activeFilter = 'all';
let currentFilmId = null;

function saveWatched() {
  localStorage.setItem('mcu_watched', JSON.stringify(watched));
}

function isWatched(id) { return watched.includes(id); }

function toggleWatched(id) {
  if (isWatched(id)) {
    watched = watched.filter(w => w !== id);
    showToast('Retiré de ta liste ✓', false);
  } else {
    watched.push(id);
    showToast('✅ Marqué comme vu !', true);
  }
  saveWatched();
  renderAll();
}

// =====================
// TOAST
// =====================
let toastTimer;
function showToast(msg, success = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (success ? '' : ' unwatched');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 2000);
}

// =====================
// MODAL
// =====================
function openModal(id) {
  currentFilmId = id;
  const f = FILMS.find(x => x.id === id);
  const arc = ARCS.find(a => a.id === f.arc);
  const ov = document.getElementById('modal-overlay');
  document.getElementById('modal-arc').textContent = arc.icon + ' ' + arc.title;
  document.getElementById('modal-arc').style.color = arc.color;
  document.getElementById('modal-title').textContent = f.title;
  document.getElementById('modal-week').textContent = '📅 ' + f.week;
  document.getElementById('modal-dl').textContent = f.dl ? '⚠️ DL : ' + f.dl : '';

  const badges = document.getElementById('modal-badges');
  badges.innerHTML = `
    <div class="modal-badge">${f.duration}</div>
    <div class="modal-badge ${f.type === 'serie' ? 'serie' : ''}">${f.type === 'serie' ? '📺 Série' : '🎬 Film'}</div>
    ${f.week.startsWith(CURRENT_WEEK) ? '<div class="modal-badge" style="background:rgba(201,168,76,0.15);color:var(--gold);border-color:rgba(201,168,76,0.3)">⭐ Semaine actuelle</div>' : ''}
  `;

  const pw = document.getElementById('modal-poster-wrap');
  if (POSTER_CACHE[id]) {
    pw.innerHTML = `<img class="modal-poster" src="${POSTER_CACHE[id]}" alt="${f.title}">`;
  } else {
    pw.innerHTML = `<div class="modal-poster-placeholder">${arc.icon}</div>`;
    fetchPoster(f.tmdb, id).then(url => {
      if (url) { POSTER_CACHE[id] = url; pw.innerHTML = `<img class="modal-poster" src="${url}" alt="${f.title}">`; }
    });
  }

  updateModalBtn();
  ov.classList.add('open');
}

function updateModalBtn() {
  const btn = document.getElementById('modal-btn');
  if (isWatched(currentFilmId)) {
    btn.textContent = 'MARQUER COMME NON VU';
    btn.className = 'modal-watch-btn unmark';
  } else {
    btn.textContent = '✅ MARQUER COMME VU';
    btn.className = 'modal-watch-btn mark';
  }
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

function toggleFromModal() {
  toggleWatched(currentFilmId);
  updateModalBtn();
}

// =====================
// POSTER FETCH
// =====================
async function fetchPoster(tmdbId, filmId) {
  const f = FILMS.find(x => x.id === filmId);
  const type = f && f.tmdbType === 'tv' ? 'tv' : 'movie';
  try {
    const r = await fetch(`https://api.themoviedb.org/3/${type}/${tmdbId}?api_key=8265bd1679663a7ea12ac168da84d2e8&language=fr-FR`);
    if (!r.ok) throw new Error();
    const d = await r.json();
    return d.poster_path ? TMDB_IMG + d.poster_path : null;
  } catch { return null; }
}

async function fetchAllPosters() {
  const promises = FILMS.map(async f => {
    const url = await fetchPoster(f.tmdb, f.id);
    if (url) POSTER_CACHE[f.id] = url;
  });
  await Promise.allSettled(promises);
  renderAll();
}

// =====================
// RENDER
// =====================
function renderAll() {
  renderCountdown();
  renderStats();
  renderTimeline();
  renderProgression();
}

function renderCountdown() {
  const now = new Date();
  const diff = Math.ceil((DOOMSDAY - now) / 86400000);
  document.getElementById('days-left').innerHTML = diff + '<span>JOURS</span>';
}

function renderWeekBanner() {
  const weekFilms = FILMS.filter(f => f.week.startsWith(CURRENT_WEEK));
  if (!weekFilms.length) return;
  const unwatched = weekFilms.filter(f => !isWatched(f.id));
  const dl = weekFilms.find(f => f.dl);
  const banner = document.getElementById('week-banner');
  banner.innerHTML = `
    <div class="week-banner-label">📅 CETTE SEMAINE — ${CURRENT_WEEK}</div>
    <div class="week-banner-title">${weekFilms.map(f => f.title.split(':')[0].trim()).join(' + ')}</div>
    <div class="week-banner-films">${unwatched.length === 0 ? '✅ Tout vu cette semaine !' : `${unwatched.length} film(s) à regarder`}</div>
    ${dl ? `<div class="week-banner-dl">⏰ Date limite : ${dl.dl}</div>` : ''}
  `;
}

function renderStats() {
  const total = FILMS.length;
  const w = watched.length;
  const remaining = total - w;

  document.getElementById('stat-watched').textContent = w;
  document.getElementById('stat-remaining').textContent = remaining;

  const pct = Math.round(w / total * 100);
  document.getElementById('ring-pct').textContent = pct + '%';
  const circ = 138.2;
  document.getElementById('ring-fill').style.strokeDashoffset = circ - (circ * pct / 100);
}

function getFilteredArcs() {
  if (activeFilter === 'all') return ARCS;
  if (activeFilter === 'todo') return ARCS;
  if (activeFilter === 'week') return ARCS;
  return ARCS.filter(a => a.id === activeFilter);
}

function getFilteredFilms(arcId) {
  return FILMS.filter(f => f.arc === arcId);
}

function renderFilters() {
  const row = document.getElementById('filter-row');
  const filters = [
    { id: 'all', label: '🎬 Tout' },
    { id: 'todo', label: '⏳ À voir' },
    { id: 'week', label: '⭐ Cette semaine' },
    ...ARCS.map(a => ({ id: a.id, label: a.icon + ' ' + a.title.split(' ')[0] }))
  ];
  row.innerHTML = filters.map(f =>
    `<div class="filter-chip ${activeFilter === f.id ? 'active' : ''}" onclick="setFilter('${f.id}')">${f.label}</div>`
  ).join('');
}

function setFilter(id) {
  activeFilter = id;
  renderAll();
}

function renderTimeline() {
  const container = document.getElementById('timeline-container');
  container.innerHTML = '';

  for (const arc of ARCS) {
    const films = getFilteredFilms(arc.id);
    if (films.length === 0) continue;

    const section = document.createElement('div');
    section.className = 'arc-section';

    const done = FILMS.filter(f => f.arc === arc.id && isWatched(f.id)).length;
    const total = FILMS.filter(f => f.arc === arc.id).length;

    section.innerHTML = `
      <div class="arc-header">
        <span class="arc-icon">${arc.icon}</span>
        <span class="arc-title" style="color:${arc.color}">${arc.title}</span>
        <div class="arc-line" style="--arc-color:${arc.color}"></div>
        <span class="arc-count">${done}/${total}</span>
      </div>
      <div class="timeline-scroll">
        <div class="timeline-track" style="--arc-color:${arc.color}">
          ${films.map(f => renderFilmCard(f, arc)).join('')}
        </div>
      </div>
    `;

    container.appendChild(section);
  }
}

function renderFilmCard(f, arc) {
  const w = isWatched(f.id);
  const isCurrent = f.week.startsWith(CURRENT_WEEK);
  const poster = POSTER_CACHE[f.id] ? `<img class="film-poster" src="${POSTER_CACHE[f.id]}" alt="${f.title}" loading="lazy">` :
    `<div class="film-poster-placeholder"><div class="ph-icon">${arc.icon}</div><div class="ph-title">${f.title.split(':')[0]}</div></div>`;

  return `
    <div class="film-card ${w ? 'watched' : ''} ${isCurrent ? 'current-week' : ''} ${f.dl ? 'deadline' : ''}"
         onclick="openModal(${f.id})">
      <div class="film-poster-wrap">
        ${poster}
        <div class="watch-badge"><div class="watch-badge-inner">✓</div></div>
      </div>
      <div class="film-info">
        <div class="film-title">${f.title}</div>
        <div class="film-meta">
          <span class="film-duration">${f.duration}</span>
          <span class="film-type-badge ${f.type === 'serie' ? 'serie' : ''}">${f.type === 'serie' ? 'série' : 'film'}</span>
        </div>
        <div class="film-week-tag">${f.week.split('—')[0].trim()}</div>
      </div>
    </div>
  `;
}

function renderProgression() {
  const container = document.getElementById('prog-container');
  container.innerHTML = '';

  for (const arc of ARCS) {
    const films = FILMS.filter(f => f.arc === arc.id);
    const done = films.filter(f => isWatched(f.id)).length;
    const pct = Math.round(done / films.length * 100);

    const el = document.createElement('div');
    el.className = 'prog-arc';
    el.innerHTML = `
      <div class="prog-arc-header">
        <div class="prog-arc-name" style="color:${arc.color}">${arc.icon} ${arc.title}</div>
        <div class="prog-arc-pct">${pct}%</div>
      </div>
      <div class="prog-bar-wrap">
        <div class="prog-bar-fill" style="width:${pct}%"></div>
      </div>
      <div class="prog-films">
        ${films.map(f => `
          <div class="prog-film-row ${isWatched(f.id) ? 'watched' : ''}" onclick="toggleWatched(${f.id})">
            <div class="prog-film-check">${isWatched(f.id) ? '✓' : ''}</div>
            <div class="prog-film-name">${f.title}</div>
            <div class="prog-film-dur">${f.duration}</div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(el);
  }
}

// =====================
// NAV
// =====================
function switchPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  document.getElementById('nav-' + p).classList.add('active');
}

// =====================
// INIT
// =====================
renderAll();
fetchAllPosters();
</script>
</body>
</html>
